[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaskr"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]

dependencies = [
    "flask"
]

# ------------ Extras (from setup.cfg) ------------
[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
]

# ------------ Package inclusion rules (MANIFEST.in) ------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
flaskr = ["schema.sql"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]

# graft flaskr/static & flaskr/templates equivalent
# (recursive include)
[tool.setuptools.package-data]
flaskr = [
    "schema.sql",
    "static/**/*",
    "templates/**/*",
]

# ------------------ Pytest Config ------------------
[tool.pytest.ini_options]
testpaths = [
    "tests"
]

# ---------------- Coverage Config -------------------
[tool.coverage.run]
branch = true
source = [
    "flaskr"
]